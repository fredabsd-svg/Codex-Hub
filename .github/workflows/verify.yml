name: Verify Codex Hub

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run dist:dir
      - name: Electron end-to-end
        run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: electron-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  windows-build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Packaged Windows smoke test
        run: npx playwright test tests/e2e/packaged.spec.ts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: codex-hub-windows
          path: |
            release/*/*.exe
            release/*/*.blockmap
          retention-days: 14
